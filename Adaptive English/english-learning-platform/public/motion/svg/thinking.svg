<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Adaptive study frog thinking"><style>.frog{transform-origin:160px 270px}.eyes{transform-origin:160px 95px}.leaf{transform-origin:160px 78px}.hand{transform-origin:225px 155px}@keyframes idle{50%{transform:translateY(-3px)}}@keyframes blink{0%,42%,49%,100%{transform:scaleY(1)}45%,47%{transform:scaleY(.08)}}@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-16deg)}50%{transform:rotate(8deg)}}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}@keyframes think{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes nod{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.96)}}@keyframes jump{0%,100%{transform:translateY(0) scale(1)}18%{transform:scale(1.06,.94)}48%{transform:translateY(-10px) scale(.96,1.04)}76%{transform:translateY(0) scale(1.08,.92)}}@keyframes listen{50%{transform:rotate(-5deg)}}@keyframes recover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.frog{animation:think 2.4s ease-in-out infinite}.eyes{animation:blink 3s infinite}</style><ellipse cx="160" cy="286" rx="92" ry="12" fill="#DCEBFF"/><g class="frog"><g class="leaf"><path d="M159 78 Q156 46 176 28" fill="none" stroke="#315F36" stroke-width="6" stroke-linecap="round"/><path d="M167 47 Q152 14 194 14 Q193 46 167 47Z" fill="#8BD46D" stroke="#315F36" stroke-width="4"/><path d="M168 44 L185 24" stroke="#315F36" stroke-width="3"/></g><ellipse cx="117" cy="268" rx="27" ry="15" fill="#83C768"/><ellipse cx="203" cy="268" rx="27" ry="15" fill="#83C768"/><path d="M78 156 Q55 218 82 226 Q99 228 102 198" fill="#83C768" stroke="#315F36" stroke-width="4"/><path d="M80 135 Q67 103 90 82 Q92 49 120 54 Q141 57 143 80 Q160 75 177 80 Q180 53 206 54 Q234 56 232 86 Q256 107 240 139 Q264 190 240 239 Q224 273 160 273 Q96 273 80 239 Q57 190 80 135Z" fill="#83C768" stroke="#315F36" stroke-width="4"/><ellipse cx="160" cy="214" rx="65" ry="48" fill="#FFF6DF"/><g class="hand"><path d="M227 170 Q252 157 252 125 Q250 111 240 122 Q251 95 237 97 Q225 99 225 130 L215 150" fill="#83C768" stroke="#315F36" stroke-width="4" stroke-linejoin="round"/></g><g class="eyes"><ellipse cx="119" cy="95" rx="9" ry="14" fill="#183D27"/><ellipse cx="201" cy="95" rx="9" ry="14" fill="#183D27"/><circle cx="121" cy="91" r="3" fill="white"/><circle cx="203" cy="91" r="3" fill="white"/></g><circle cx="103" cy="139" r="17" fill="#FF9290"/><circle cx="218" cy="139" r="17" fill="#FF9290"/><path class="mouth" d="M144 136 Q160 154 176 136" fill="none" stroke="#183D27" stroke-width="5" stroke-linecap="round"/><path d="M82 174 Q157 204 232 174 L219 199 Q158 219 97 193Z" fill="#3478F6" stroke="#2456AE" stroke-width="3"/><path d="M214 191 Q253 180 243 217 Q222 214 214 191Z M214 191 Q227 221 208 232 Q197 210 214 191Z" fill="#3478F6" stroke="#2456AE" stroke-width="3"/><circle cx="214" cy="190" r="10" fill="#2563EB"/></g></svg>