services:
  - type: web
    name: adaptivemath-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build:api
    startCommand: npm run start --workspace=@adaptivemath/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        value: https://adaptivemath-two.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: am_session
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: INVITE_CODE_HMAC_SECRET
        generateValue: true
